name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.DZIDZI_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dzidzi.keystore"
      - name: Build signed release APK
        env:
          DZIDZI_KEYSTORE: ${{ runner.temp }}/dzidzi.keystore
          DZIDZI_KEYSTORE_PASS: ${{ secrets.DZIDZI_KEYSTORE_PASS }}
          DZIDZI_KEY_ALIAS: ${{ secrets.DZIDZI_KEY_ALIAS }}
          DZIDZI_KEY_PASS: ${{ secrets.DZIDZI_KEY_PASS }}
        run: ./gradlew assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk dzidzi-${{ github.ref_name }}.apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dzidzi-${{ github.ref_name }}.apk
          body: |
            One APK for all devices — Android TV, Google TV and phones (arm64 + arm32).
            Sideload with the Downloader app or `adb install`.
          generate_release_notes: true
