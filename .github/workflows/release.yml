name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk dzidzi-${{ github.ref_name }}.apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dzidzi-${{ github.ref_name }}.apk
          generate_release_notes: true
