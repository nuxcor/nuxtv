name: Release

# Releasing is deliberate: run this workflow from the Actions tab (or push a v*
# tag) when a build has actually been verified on a TV. It used to fire on every
# merge to main, which meant code reached users minutes after being written and
# device-only bugs — the kind unit tests can't reach — shipped before anyone
# had run the app. Merges still build and test via build.yml; they just don't
# publish any more.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated by diffing against the previous tag.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            name=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)
            if [ -z "$name" ]; then
              echo "::error::Could not read versionName from app/build.gradle.kts"
              exit 1
            fi
            tag="v$name"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      # A merge that didn't bump the version has nothing new to publish. That is
      # the normal case for most merges, so it must not fail the run or
      # overwrite the APK already attached to the existing release.
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.tag }} is already released — bump versionName in app/build.gradle.kts to publish a new one."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Signing is checked before the long build so a missing secret fails in
      # seconds with a clear reason, rather than as an opaque Gradle error.
      - name: Verify signing secrets
        if: steps.check.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.DZIDZI_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.DZIDZI_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.DZIDZI_KEY_PASS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing DZIDZI_KEYSTORE_B64"
          [ -z "$KEYSTORE_PASS" ] && missing="$missing DZIDZI_KEYSTORE_PASS"
          [ -z "$KEY_PASS" ] && missing="$missing DZIDZI_KEY_PASS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — without them the APK would be signed with the debug key and could not install over an existing release."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.skip == 'false'

      # Stripping the prebuilt .so files needs the NDK's strip tool, and a
      # missing NDK only warns — which is how v2.10.2 and everything before it
      # shipped 8 MB of arm64 debug symbols. Keep in step with ndkVersion in
      # app/build.gradle.kts; the install is a no-op when already present.
      - name: Install NDK
        if: steps.check.outputs.skip == 'false'
        run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"

      # An auto-publishing pipeline must not ship code the tests reject.
      - name: Test
        if: steps.check.outputs.skip == 'false'
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        if: steps.check.outputs.skip == 'false'
        run: echo "${{ secrets.DZIDZI_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dzidzi.keystore"

      - name: Build signed release APK
        if: steps.check.outputs.skip == 'false'
        env:
          DZIDZI_KEYSTORE: ${{ runner.temp }}/dzidzi.keystore
          DZIDZI_KEYSTORE_PASS: ${{ secrets.DZIDZI_KEYSTORE_PASS }}
          DZIDZI_KEY_ALIAS: ${{ secrets.DZIDZI_KEY_ALIAS }}
          DZIDZI_KEY_PASS: ${{ secrets.DZIDZI_KEY_PASS }}
          # Absent secret builds fine — enrichment just falls back to the
          # Settings field, as it did before the key was bundled.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleRelease

      # Two names for one APK. The versioned one is the archive; the plain one
      # is what /releases/latest/download/dzidzi.apk resolves to, so the short
      # link people type into the Downloader app never has to change.
      - name: Name APKs
        if: steps.check.outputs.skip == 'false'
        run: |
          cp app/build/outputs/apk/release/app-release.apk dzidzi-${{ steps.version.outputs.tag }}.apk
          cp app/build/outputs/apk/release/app-release.apk dzidzi.apk

      # Creates the tag at this commit when the run came from a merge; reuses
      # the pushed tag otherwise.
      - name: Create release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dzidzi-${{ steps.version.outputs.tag }}.apk
            dzidzi.apk
          body: |
            One APK for all devices — Android TV, Google TV and phones (arm64 + arm32).

            **Install on a TV:** open the Downloader app and enter code `7141087`
            (or type `nuxcor.github.io/nuxtv`). Both resolve to the APK below, so
            they keep working on every future release without being reissued.

            On a computer: `adb install dzidzi-${{ steps.version.outputs.tag }}.apk`.
          generate_release_notes: true
